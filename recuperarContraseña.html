<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - GM</title>
    <link rel="stylesheet" href="./css/recuperarContraseña.css">
</head>
<body>
    <div class="container">
        <div class="left-section">
            <div class="logo-container">
                <img src="./images/logo.jpg" alt="Logo GM" class="logo">
            </div>

            <div class="form-container">
                <h2 class="title">¿Olvidaste tu contraseña?</h2>
                
                <p class="instruction">
                    Ingresa la dirección de email o nombre de usuario con el que te registraste para continuar.
                </p>

                <form id="recuperarForm" onsubmit="recuperarPassword(event)">
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input 
                            type="text" 
                            id="email" 
                            name="email" 
                            placeholder="Ingresa tu email o usuario"
                            required
                        >
                    </div>

                    <button type="submit" class="btn-continuar">CONTINUAR</button>
                </form>

                <div class="back-to-login">
                    <a href="index.html">Volver al inicio de sesión</a>
                </div>
            </div>
        </div>

        <div class="right-section">
            <img src="./images/gmc.jpeg" alt="GMC Truck" class="truck-image">
        </div>
    </div>

    <script src="./js/recuperarContraseña.js"></script>
</body>
</html>
