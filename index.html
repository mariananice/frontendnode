<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>paginaLogin</title>
    <link rel="stylesheet" href="./css/index.css">
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <div class="logo">
                <img src="./images/logo.jpg" alt="Logo GM">
            </div>    

            <h2>Login</h2>

            <p class="subtitle">Don't have an account?</p>
            <a href="#" class="link" onclick="registro()">Get GM now</a>

            <form class="login-form" id="loginForm" novalidate>
                <label>GMIN:</label>
                <input type="text" id="gmin">
                <span class="error" id="gminError"></span>

                <label>Password:</label>
                <input type="password" id="password">
                <span class="error" id="passwordError"></span>

                <a href="#" class="link" onclick="recuperarContraseña()">Forgot your password?</a>

                <button type="submit">Login</button>
            </form>
        </div>    
            
            <div class="right-panel">
                <img src="./images/gmc.jpeg" alt="GMC Truck">
            </div>
    </div>

    <script src="./js/app.js"></script>
</body>
</html>
