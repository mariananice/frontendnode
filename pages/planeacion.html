<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GM Dashboard - Planeación</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <link
        rel="stylesheet"
        href="../css/planeacion.css"
    >

    <style>
        .week-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .week-controls input[type="date"] {
            min-height: 38px;
            padding: 6px 10px;
            border: 1px solid #d0d5dd;
            border-radius: 6px;
            background: #ffffff;
        }

        @media (max-width: 900px) {
            .week-controls {
                width: 100%;
            }

            .week-controls .btn,
            .week-controls input {
                flex: 1;
            }
        }
    </style>
</head>

<body>
    <div class="app">

        <aside class="sidebar">
            <div class="logo-container">
                <div class="logo">
                    <img
                        src="../images/logo.jpg"
                        alt="Logo GM"
                    >
                </div>

                <h3 class="app-name"></h3>
            </div>

            <nav class="menu">
                <ul>
                    <li>
                        <a href="dashboard.html">
                            <i class="bi bi-bar-chart-fill"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>

                    <li>
                        <a href="programaProduccion.html">
                            <i class="bi bi-clipboard-data"></i>
                            <span>Programa de Producción</span>
                        </a>
                    </li>

                    <li>
                        <a href="programacion.html">
                            <i class="bi bi-calendar"></i>
                            <span>Programación</span>
                        </a>
                    </li>

                    <li class="active">
                        <i class="bi bi-gear"></i>
                        <span>Planeación</span>
                    </li>

                    <li>
                        <a href="reqBody.html">
                            <i class="bi bi-box"></i>
                            <span>Req Body</span>
                        </a>
                    </li>

                    <li>
                        <a href="secuencia.html">
                            <i class="bi bi-clock"></i>
                            <span>Secuencia</span>
                        </a>
                    </li>

                    <li>
                        <a href="cumplimiento.html">
                            <i class="bi bi-bar-chart-line"></i>
                            <span>Cumplimiento</span>
                        </a>
                    </li>

                    <li>
                        <a href="datos.html">
                            <i class="bi bi-database"></i>
                            <span>Datos</span>
                        </a>
                    </li>

                    <li>
                        <a href="usuarios.html">
                            <i class="bi bi-people-fill"></i>
                            <span>Usuarios</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <main class="main">

            <header class="topbar">
                <div class="planeacion-search">
                    <i class="bi bi-search"></i>

                    <input
                        id="searchPlaneacion"
                        type="search"
                        placeholder="Buscar en la semana..."
                    >
                </div>

                <div class="icons">
                    <button
                        class="icon-btn"
                        id="btnNotificaciones"
                        type="button"
                    >
                        <i class="bi bi-bell-fill"></i>
                        <span class="notification-badge"></span>
                    </button>

                    <button
                        class="icon-btn"
                        id="btnPerfil"
                        type="button"
                    >
                        <i class="bi bi-person-circle"></i>
                    </button>

                    <button
                        class="icon-btn"
                        id="btnLogout"
                        type="button"
                    >
                        <i class="bi bi-box-arrow-right"></i>
                    </button>
                </div>
            </header>

            <section
                id="planeacion"
                class="section active"
            >

                <div class="section-heading">
                    <div>
                        <h1>Planeación</h1>

                        <p
                            id="rangoSemana"
                            class="week-caption"
                        ></p>
                    </div>

                    <div class="week-controls">
                        <button
                            id="btnSemanaAnterior"
                            class="btn btn-primary"
                            type="button"
                        >
                            <i class="bi bi-chevron-left"></i>
                            Semana anterior
                        </button>

                        <input
                            id="selectorSemana"
                            type="date"
                            value="2026-01-07"
                            title="Seleccionar semana"
                        >

                        <button
                            id="btnSemanaSiguiente"
                            class="btn btn-primary"
                            type="button"
                        >
                            Semana siguiente
                            <i class="bi bi-chevron-right"></i>
                        </button>

                        <button
                            id="btnRecargarPlaneacion"
                            class="btn btn-primary"
                            type="button"
                        >
                            <i class="bi bi-arrow-clockwise"></i>
                            Recargar
                        </button>
                    </div>
                </div>

                <div
                    id="planeacionEstado"
                    class="planeacion-status"
                ></div>

                <section class="planeacion-captura">
                    <h2>Agregar planeación</h2>

                    <form id="formPlaneacion">
                        <div class="captura-grid">

                            <div class="captura-campo">
                                <label for="capturaFecha">
                                    Fecha
                                </label>

                                <input
                                    id="capturaFecha"
                                    name="fecha"
                                    type="date"
                                    value="2026-01-07"
                                    required
                                >
                            </div>

                            <div class="captura-campo">
                                <label for="capturaLinea">
                                    Línea
                                </label>

                                <select
                                    id="capturaLinea"
                                    name="linea"
                                    required
                                >
                                    <option value="XL1">
                                        XL1
                                    </option>

                                    <option value="XL2">
                                        XL2
                                    </option>
                                </select>
                            </div>

                            <div class="captura-campo">
                                <label for="capturaHora">
                                    Hora
                                </label>

                                <input
                                    id="capturaHora"
                                    name="hora"
                                    type="time"
                                    value="06:00"
                                    required
                                >
                            </div>

                            <div class="captura-campo">
                                <label for="capturaIdParte">
                                    Parte
                                </label>

                                <select
                                    id="capturaIdParte"
                                    name="id_parte"
                                    required
                                >
                                    <option value="">
                                        Cargando partes...
                                    </option>
                                </select>
                            </div>

                            <div class="captura-campo">
                                <label for="capturaCantidad">
                                    Cantidad planeada
                                </label>

                                <input
                                    id="capturaCantidad"
                                    name="cantidad_planeada"
                                    type="number"
                                    min="1"
                                    placeholder="Ej. 100"
                                    required
                                >
                            </div>

                            <div class="captura-acciones">
                                <button
                                    id="btnGuardarPlaneacion"
                                    class="btn btn-primary"
                                    type="submit"
                                >
                                    <i class="bi bi-save"></i>
                                    Guardar planeación
                                </button>
                            </div>

                        </div>
                    </form>

                    <div
                        id="mensajeFormularioPlaneacion"
                        class="planeacion-form-message"
                    ></div>
                </section>

                <div id="planeacionSemana"></div>

            </section>

            <div
                class="center-modal"
                id="panelPerfil"
            >
                <div class="center-modal-content">
                    <div class="center-modal-header">
                        <h2>Perfil de usuario</h2>

                        <button
                            class="center-modal-close"
                            type="button"
                            data-close-panel
                        >
                            <i class="bi bi-x-circle-fill"></i>
                        </button>
                    </div>

                    <div class="center-modal-body">
                        <p>
                            <strong>Nombre:</strong>
                            <span id="perfilPlaneacionNombre"></span>
                        </p>

                        <p>
                            <strong>Correo:</strong>
                            <span id="perfilPlaneacionCorreo"></span>
                        </p>

                        <p>
                            <strong>Rol:</strong>
                            <span id="perfilPlaneacionRol"></span>
                        </p>

                        <p>
                            <strong>GMIN:</strong>
                            <span id="perfilPlaneacionGmin"></span>
                        </p>
                    </div>
                </div>
            </div>

            <div
                class="center-modal"
                id="panelNotificaciones"
            >
                <div class="center-modal-content">
                    <div class="center-modal-header">
                        <h2>Notificaciones</h2>

                        <button
                            class="center-modal-close"
                            type="button"
                            data-close-panel
                        >
                            <i class="bi bi-x-circle-fill"></i>
                        </button>
                    </div>

                    <div
                        class="center-modal-body"
                        id="listaNotificacionesPlaneacion"
                    ></div>
                </div>
            </div>

        </main>
    </div>

    <script src="../js/planeacion.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
