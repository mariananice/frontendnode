<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GM Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    <div class="app">

        <aside class="sidebar">
          <div class="logo-container">
            <div class="logo">
                <img src="../images/logo.jpg" alt="Logo GM">
            </div>
            <h3 class="app-name"></h3>
          </div>

          <nav class="menu">
            <ul>
              <li class="active" data-section="dashboard">
                <i class="bi bi-bar-chart-fill"></i>
                <span>Dashboard</span>
              </li>
              <li data-section="produccion">
                <a href="programaProduccion.html">
                  <i class="bi bi-clipboard-data"></i>
                  <span>Programa de Producción</span>
                </a>
              </li>
              <li data-section="programacion">
                <a href="programacion.html">
                  <i class="bi bi-calendar"></i>
                  <span>Programación</span>
                </a>
              </li>
              <li data-section="planeacion">
                <a href="planeacion.html">
                    <i class="bi bi-gear"></i>
                    <span>Planeación</span>
                </a>
              </li>
              <li data-section="reqbody">
                <a href="reqBody.html">
                    <i class="bi bi-box"></i>
                    <span>Req Body</span>
                </a>
              </li>
              <li data-section="secuencia">
                <a href="secuencia.html">
                    <i class="bi bi-clock"></i>
                    <span>Secuencia</span>
                </a>
              </li>
              <li data-section="cumplimiento">
                <a href="cumplimiento.html">
                    <i class="bi bi-bar-chart-line"></i>
                    <span>Cumplimiento</span>
                </a>
              </li>
              <li data-section="datos">
                <a href="datos.html">
                    <i class="bi bi-database"></i>
                    <span>Datos</span>
                </a>
              </li>
              <li data-section="usuarios">
                <a href="usuarios.html">
                    <i class="bi bi-people-fill"></i>
                    <span>Usuarios</span>
                </a>
              </li>
            </ul>
          </nav>
        </aside>

        <main class="main">
            <header class="topbar">
                <div class="search-container">
                  <i class="bi bi-search"></i>
                  <input type="text" placeholder="Barra de búsqueda">
                </div>
                <div class="icons">
                  <button class="icon-btn">
                    <i class="bi bi-bell-fill"></i>
                    <span class="notification-badge"></span>
                  </button>
                  <button class="icon-btn">
                    <i class="bi bi-person-circle"></i>
                  </button>
                  <button class="icon-btn" onclick="logout()">
                    <i class="bi bi-box-arrow-right"></i>
                  </button>
                </div>
            </header>

            <section id="dashboard" class="section active">
              <h1 class="page-title">Dashboard</h1>

              <div class="dashboard-grid">
                <div class="card">
                  <h2 class="card-title">Turnos</h2>
                  <div class="turnos-container">
                    <div class="turno-item">
                      <div class="turno-label">Primer Turno</div>
                      <div class="turno-time">06:00 - 18:00</div>
                    </div>
                    <div class="turno-item">
                      <div class="turno-label">Segundo Turno</div>
                      <div class="turno-time">18:00 - 06:00</div>
                    </div>
                  </div>
                </div>

                <div class="card">
                <h2 class="card-title">Material</h2>
                <div class="material-container">
                  <div class="material-item">
                    <div class="material-label">Material A:</div>
                    <div class="meterial-status">Disponible</div>
                  </div>
                  <div class="material-item">
                    <div class="material-label">Material B:</div>
                    <div class="meterial-status">En tránsito</div>
                  </div>
                  <div class="material-item">
                    <div class="material-label">Material C:</div>
                    <div class="meterial-status">Stock bajo</div>
                  </div>
                </div>
                </div>
              </div>
            </section>
        </main>
    </div>

    <script src="../js/dashboard.js"></script>
    
</body>
</html>
